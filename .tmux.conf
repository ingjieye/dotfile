# 激活按键
set -g prefix ^g
unbind ^b
bind ^g send-prefix

# set -g default-terminal screen-256color
set -g default-terminal tmux-256color
set -ag terminal-overrides ",alacritty*:RGB,foot*:RGB,xterm-kitty*:RGB,xterm-256color:RGB"
set -as terminal-features ",alacritty*:RGB,foot*:RGB,xterm-kitty*:RGB,xterm-256color:RGB"

set -sg escape-time 0 # esc键延迟
set -wg remain-on-exit off
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 50000
set -g renumber-windows on
set-option -g focus-events on

#set-window-option -g visual-bell on
#set-window-option -g bell-action any

# setw -g aggressive-resize on

# Reload
bind R source ~/.tmux.conf \; display ".tmux.conf reloaded"

# Pane title
setw -g pane-border-status off
# setw -g pane-border-format '#{?pane_active,#[reverse],}#{pane_index}: #{pane_title}#[default]'

# 状态栏
set -g status-bg black
set -g status-fg white
set -g status-position top
set -g status-justify centre
# set -g status-interval 1 #状态栏刷新 interval
set-option -g status-left '#[bg=black,fg=green][#[fg=cyan]#S#[fg=green]]'
set-option -g status-left-length 20
set -g status-right '#[fg=green][#[fg=cyan]#($HOME/bin/tmux-agent-hook/bin/tmux-agent-status status-right)#[fg=green]] #[fg=green][#[fg=cyan]%H:%M#[fg=green]]'
setw -g automatic-rename off
set-window-option -g window-status-format '#[dim]#I:#[default]#W#{?window_activity_flag,#[fg=yellow]#(~/.local/bin/tmux-activity-spinner),}#[fg=grey,dim]'
set-window-option -g window-status-current-format '#[fg=cyan,bold]#I#[fg=blue]:#[fg=cyan]#W#[fg=dim]'

set-window-option -g monitor-activity off #Activity 检测
set-window-option -g window-status-activity-style default
set-window-option -g window-status-bell-style default

set-option -g set-titles on
set-option -g set-titles-string "#{session_name}"

# 复制模式
setw -g mode-keys vi
bind-key v copy-mode
bind-key -T copy-mode-vi y if-shell -F "#{==:#{scroll_position},0}" "send-keys -X copy-selection-and-cancel" "send-keys -X copy-selection"
bind-key -T copy-mode-vi MouseDragEnd1Pane if-shell -F "#{==:#{scroll_position},0}" "send-keys -X copy-selection-and-cancel" "send-keys -X copy-selection"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Open current pane history with nvim (prefix + Enter)
bind-key Enter capture-pane -S -102400 -e -J \; run-shell 'tmux save-buffer - > /tmp/tmux-pane-capture.txt && tmux delete-buffer' \; new-window -a 'nvim -c "terminal cat /tmp/tmux-pane-capture.txt" -c "normal G" -c "nnoremap <buffer> q :q!<CR>"'

# Mouse
set -g mouse on
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down
bind M set -g mouse on
bind m set -g mouse off

# Agent status: mark an active agent pane as interrupted before forwarding Ctrl-C.
bind-key -n C-c run-shell -b '$HOME/bin/tmux-agent-hook/bin/tmux-agent-status mark-interrupted' \; send-keys C-c
bind-key u run-shell -b '$HOME/bin/tmux-agent-hook/bin/tmux-agent-status clear --pane "#{pane_id}"'
set-hook -g window-layout-changed[90] 'run-shell -b "$HOME/bin/tmux-agent-hook/bin/tmux-agent-status refresh"'
set-hook -g window-linked[90] 'run-shell -b "$HOME/bin/tmux-agent-hook/bin/tmux-agent-status refresh"'
set-hook -g window-unlinked[90] 'run-shell -b "$HOME/bin/tmux-agent-hook/bin/tmux-agent-status refresh"'

# use current path
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# panel 切换按键绑定
bind k selectp -U
bind j selectp -D
bind h selectp -L
bind l selectp -R

bind -r K resizep -U 1
bind -r J resizep -D 1
bind -r H resizep -L 1
bind -r L resizep -R 1

bind -r p selectw -t :-
bind -r n selectw -t :+

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
	| grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
#is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
	#| grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|\.?n?vim?x?(-wrapped)?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n 'C-j' if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n 'C-k' if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n 'C-l' if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Plugins  {{{1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'pschmitt/tmux-ssh-split'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect option
# Don't restore any programs
set -g @resurrect-processes 'false'

# tmux-continuum 自动保存和恢复
set -g @continuum-restore 'on'        # 自动恢复上次保存的 session
set -g @continuum-save-interval '15'  # 每 15 分钟自动保存一次

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
